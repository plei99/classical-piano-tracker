[workspace]
resolver = "3"
members = ["crates/*"]
# Everything but the web client, which tracker-web's build script compiles
# for wasm32; `--workspace` (tests, clippy) still builds it natively.
default-members = [
    "crates/tracker-app",
    "crates/tracker-cli",
    "crates/tracker-core",
    "crates/tracker-llm",
    "crates/tracker-recommend",
    "crates/tracker-spotify",
    "crates/tracker-tui",
    "crates/tracker-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The web client (wasm32), built by tracker-web's build script: small over
# fast, since the browser downloads and compiles it on every launch.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = "debuginfo"
