[package]
name = "tracker-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The track browser's state machine and presenter (the terminal UI, and the
# web server's first render), plus the web API contract. Pure: no terminal,
# threads, database, or network.

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracker-core = { version = "0.1.0", path = "../tracker-core" }

[dev-dependencies]
# The web client's TypeScript bindings; see the bindings test in src/api.rs.
tracker-core = { version = "0.1.0", path = "../tracker-core", features = ["ts"] }
ts-rs = "12.0.1"

