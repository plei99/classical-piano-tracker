[package]
name = "tracker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
jiff = "0.2.37"
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["macros", "rt", "signal"] }
tracker-core = { version = "0.1.0", path = "../tracker-core" }
tracker-llm = { version = "0.1.0", path = "../tracker-llm" }
tracker-recommend = { version = "0.1.0", path = "../tracker-recommend" }
tracker-spotify = { version = "0.1.0", path = "../tracker-spotify" }
tracker-tui = { version = "0.1.0", path = "../tracker-tui" }
tracker-web = { version = "0.1.0", path = "../tracker-web" }

[build-dependencies]
jiff = "0.2.37"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
