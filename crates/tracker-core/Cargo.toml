[package]
name = "tracker-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native"]
# The SQLite store, the config file, and on-disk paths. Without it only the
# plain data types and artist formatting remain, which also build for
# wasm32 (the web client).
native = ["dep:jiff", "dep:rusqlite"]

[dependencies]
anyhow = "1.0.104"
jiff = { version = "0.2.37", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
