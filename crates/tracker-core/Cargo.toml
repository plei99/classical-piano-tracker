[package]
name = "tracker-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# TypeScript bindings for the types the web API carries (ts-rs); tracker-app's
# tests export them to web/src/generated.
ts = ["dep:ts-rs"]

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.37"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
