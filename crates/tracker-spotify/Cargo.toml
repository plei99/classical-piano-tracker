[package]
name = "tracker-spotify"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes `test_support` (a mock HTTP server) to other crates' tests.
test-support = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
form_urlencoded = "1"
getrandom = "0.4"
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracker-core = { version = "0.1.0", path = "../tracker-core" }
ureq = { version = "3.4.2", features = ["json"] }
