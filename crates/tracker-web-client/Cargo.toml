[package]
name = "tracker-web-client"
version.workspace = true
edition.workspace = true
license.workspace = true

# The browser client for `tracker web`, and the server's renderer for its
# first screen: the same Leptos components either hydrate in the browser
# (feature `hydrate`, wasm32, built by tracker-web's build script as a
# cdylib) or render to HTML on the server (feature `ssr`, which tracker-web
# enables). Natively it also builds for `cargo test` and clippy.

[features]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "dep:hydration_context"]

[dependencies]
anyhow = "1.0.104"
console_error_panic_hook = "0.1.7"
hydration_context = { version = "0.3.1", optional = true }
js-sys = "0.3"
leptos = "0.8.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracker-app = { version = "0.1.0", path = "../tracker-app" }
tracker-core = { version = "0.1.0", path = "../tracker-core", default-features = false }
# Pinned to the wasm-bindgen CLI that generates the JavaScript glue.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "EventSource",
    "FocusOptions",
    "Headers",
    "HtmlDocument",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "RequestInit",
    "ResizeObserver",
    "Response",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Window",
] }

# The browser has no clock or zone database of its own for Rust: read the
# time and zone through JavaScript and bundle the IANA database.
[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { version = "0.2.37", features = ["js", "tzdb-bundle-always"] }
